  <body>
    <h1>Exercice : Destructuring (ES6)</h1>

    <script>
      /*
      OBJECTIF
      Comprendre le destructuring sur :
      - un tableau (array)
      - un objet (object)

      CONSIGNES
      1) Copie ce code
      2) Lis les commentaires
      3) Complète les parties "TODO"
      4) Vérifie les résultats dans la console
    */

      // PARTIE 1 : ARRAY DESTRUCTURING

      const fruits = ["Apple", "Banana", "Orange"];

      // TODO 1 :
      // Sans destructuring, récupère le 1er fruit et affiche-le dans la console.
      // Exemple attendu : "Sans destructuring: Apple"

      // TODO 2 :
      // Avec destructuring, récupère le 1er et le 2ème fruit.
      // Affiche-les : "Avec destructuring: Apple Banana"

      // TODO 3 (BONUS) :
      // Avec destructuring + rest operator, récupère :
      // - le premier fruit dans une variable "first"
      // - le reste des fruits dans une variable "others"
      // Affiche : first puis others

      // PARTIE 2 : OBJECT DESTRUCTURING

      const user = { name: "Ayoub", role: "Developer", city: "Casablanca" };

      // TODO 4 :
      // Sans destructuring, récupère user.name et user.role
      // Affiche : "Sans destructuring: Ayoub Developer"

      // TODO 5 :
      // Avec destructuring, récupère name et city
      // Affiche : "Avec destructuring: Ayoub Casablanca"

      // TODO 6 (BONUS) :
      // Avec destructuring + alias (renommer)
      // Récupère name sous le nom fullName
      // Exemple : const { name: fullName } = user;
      // Affiche : "Alias: Ayoub"
    </script>
